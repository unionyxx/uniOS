name: Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Generate wiki
      run: python3 tools/docs_site.py --source docs/reference --dest build/site/wiki

    - name: Assemble site
      run: |
        cp docs/index.html docs/style.css docs/robots.txt docs/sitemap.xml build/site/
        cp -r docs/assets build/site/assets

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
